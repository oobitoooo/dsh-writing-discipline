name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: node --check lib/index.js && node --check lib/rules.js
      - name: smoke tests
        run: node test/smoke.mjs
      - name: cli smoke (exit 0 on clean, 1 on dirty)
        run: |
          node bin/wd-lint.mjs -q README.md
          if node bin/wd-lint.mjs -q -t "本内容仅供参考，不构成任何建议。"; then
            echo "::error::dirty text should fail the gate"; exit 1
          fi
          node bin/wd-lint.mjs --json -q -t "P95 从 840 ms 降到 210 ms（n=12000）。" | head -5
      - name: self-lint README
        run: |
          node -e "
          import('./lib/rules.js').then(m => {
            const fs = require('fs');
            const r = m.scan(fs.readFileSync('README.md', 'utf8'), { profile: 'readme' });
            const errs = r.hits.filter(h => h.severity === 'error');
            console.log('README hits:', r.counts, 'ok:', r.ok);
            if (errs.length) { console.error(m.formatReport(r)); process.exit(1); }
          })"
